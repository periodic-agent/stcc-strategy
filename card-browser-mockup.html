<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST:CC Card Browser — Core Box</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e1a;--bg2:#0f1628;--bg3:#141c35;
  --blue:#4a9fd4;--blue2:#7ec8f0;--gold:#c8a84b;
  --text:#ccd6f0;--muted:#7a8aaa;--border:rgba(74,159,212,0.25);
  --person:#e8a94a;--ally:#9b6ecf;--ship:#7a8aaa;
  --cargo:#3a6aaa;--location:#4ac48a;--encounter:#d4699f;--incident:#e05a5a;
  --sp-bg:rgba(220,140,60,0.12);--sp-bd:rgba(220,140,60,0.45);--sp-tx:#e09050;
  --rg-bg:rgba(74,159,212,0.10);--rg-bd:rgba(74,159,212,0.35);--rg-tx:#7ec8f0;
  --ot-bg:rgba(200,60,60,0.10);--ot-bd:rgba(200,60,60,0.35);--ot-tx:#e05a5a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Exo 2',sans-serif;font-weight:300;background:var(--bg);color:var(--text);min-height:100vh;}
a{color:var(--blue);text-decoration:none;}

/* NAV */
.nav-bar{background:var(--bg);border-bottom:1px solid var(--border);padding:0.75rem 1.5rem;}
.nav-bar a{font-family:'Orbitron',sans-serif;font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;}

/* HEADER */
.chapter-header{background:linear-gradient(135deg,#061020 0%,#0d1e3a 50%,#061020 100%);border-bottom:2px solid var(--blue);padding:2.5rem 2rem 2rem;text-align:center;position:relative;overflow:hidden;}
.chapter-header::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(74,159,212,0.03) 60px,rgba(74,159,212,0.03) 61px);}
.chapter-label{font-family:'Orbitron',sans-serif;font-size:0.7rem;letter-spacing:0.25em;color:var(--blue);text-transform:uppercase;margin-bottom:0.6rem;}
.chapter-title{font-family:'Orbitron',sans-serif;font-size:clamp(1.4rem,4vw,2.2rem);font-weight:700;color:#fff;letter-spacing:0.05em;text-shadow:0 0 40px rgba(74,159,212,0.5);}
.chapter-title span{color:var(--blue2);}
.chapter-meta{margin-top:0.6rem;font-size:0.78rem;color:var(--muted);}

/* CONTROLS */
.controls{max-width:1100px;margin:1.5rem auto 0;padding:0 1.5rem;}
.filter-section{margin-bottom:1rem;}
.filter-label{font-family:'Orbitron',sans-serif;font-size:0.55rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:0.5rem;}
.pill-row{display:flex;flex-wrap:wrap;gap:0.35rem;}

/* SEARCH ROW */
.search-row{display:flex;gap:0.75rem;align-items:center;margin-bottom:1.25rem;}
.search-box{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:0.55rem 0.9rem;font-family:'Exo 2',sans-serif;font-size:0.9rem;color:var(--text);outline:none;transition:border-color 0.2s;}
.search-box::placeholder{color:var(--muted);}
.search-box:focus{border-color:var(--blue);}

/* VIEW TOGGLE */
.view-toggle{display:flex;gap:0.35rem;}
.vtoggle{font-family:'Orbitron',sans-serif;font-size:0.52rem;letter-spacing:0.1em;text-transform:uppercase;background:transparent;border:1px solid var(--border);color:var(--muted);padding:0.35rem 0.7rem;border-radius:3px;cursor:pointer;transition:all 0.15s;}
.vtoggle.active{border-color:var(--blue);color:var(--blue2);background:rgba(74,159,212,0.1);}

.clear-btn{font-family:'Orbitron',sans-serif;font-size:0.52rem;letter-spacing:0.1em;text-transform:uppercase;background:transparent;border:1px solid var(--border);color:var(--muted);padding:0.35rem 0.7rem;border-radius:3px;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.clear-btn:hover{color:var(--text);border-color:var(--blue);}

/* BOX PILLS */
.box-pill{font-family:'Exo 2',sans-serif;font-size:0.72rem;padding:0.22rem 0.75rem;border-radius:3px;border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all 0.15s;user-select:none;}
.box-pill:hover{border-color:var(--blue2);color:var(--blue2);}
.box-pill.active{background:rgba(74,159,212,0.15);border-color:var(--blue);color:#fff;}
.box-pill[data-box="core"]{border-color:#4a9fd4;color:#4a9fd4;}
.box-pill[data-box="core"].active{background:#4a9fd4;border-color:#4a9fd4;color:#000;font-weight:600;}
.box-pill[data-box="tbg"]{border-color:#c0392b;color:#c0392b;}
.box-pill[data-box="tbg"]:hover{border-color:#e05a5a;color:#e05a5a;}
.box-pill[data-box="tbg"].active{background:#c0392b;border-color:#c0392b;color:#fff;font-weight:600;}
.box-pill[data-box="2nd"]{border-color:#c8a84b;color:#c8a84b;}
.box-pill[data-box="2nd"]:hover{border-color:#e8c96a;color:#e8c96a;}
.box-pill[data-box="2nd"].active{background:#c8a84b;border-color:#c8a84b;color:#000;font-weight:600;}

/* DECK PILLS */
.deck-pill{font-family:'Exo 2',sans-serif;font-size:0.68rem;padding:0.18rem 0.6rem;border-radius:3px;border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all 0.15s;user-select:none;}
.deck-pill.core{border-color:rgba(74,159,212,0.4);color:#4a9fd4;}
.deck-pill.core:hover,.deck-pill.core.active{background:rgba(74,159,212,0.15);border-color:#4a9fd4;color:#7ec8f0;}
.deck-pill.tbg{border-color:rgba(192,57,43,0.4);color:#c0392b;}
.deck-pill.tbg:hover,.deck-pill.tbg.active{background:rgba(192,57,43,0.15);border-color:#e05a5a;color:#ff8080;}
.deck-pill.second{border-color:rgba(200,168,75,0.4);color:#c8a84b;}
.deck-pill.second:hover,.deck-pill.second.active{background:rgba(200,168,75,0.15);border-color:#e8c96a;color:#f0d878;}
.deck-pill.common{border-color:rgba(74,159,212,0.4);color:#4a9fd4;}
.deck-pill.common:hover,.deck-pill.common.active{background:rgba(74,159,212,0.15);border-color:#4a9fd4;color:#7ec8f0;}

/* SUIT PILLS */
.suit-pill{font-family:'Exo 2',sans-serif;font-size:0.72rem;padding:0.22rem 0.65rem;border-radius:3px;border:1px solid;cursor:pointer;transition:background 0.15s;user-select:none;}
.suit-pill[data-suit="Person"]{border-color:var(--person);color:var(--person);}
.suit-pill[data-suit="Ally"]{border-color:var(--ally);color:var(--ally);}
.suit-pill[data-suit="Ship"]{border-color:var(--ship);color:var(--ship);}
.suit-pill[data-suit="Cargo"]{border-color:var(--cargo);color:var(--cargo);}
.suit-pill[data-suit="Location"]{border-color:var(--location);color:var(--location);}
.suit-pill[data-suit="Encounter"]{border-color:var(--encounter);color:var(--encounter);}
.suit-pill[data-suit="Incident"]{border-color:var(--incident);color:var(--incident);}
.suit-pill.active[data-suit="Person"]{background:var(--person);color:#000;}
.suit-pill.active[data-suit="Ally"]{background:var(--ally);color:#fff;}
.suit-pill.active[data-suit="Ship"]{background:var(--ship);color:#fff;}
.suit-pill.active[data-suit="Cargo"]{background:var(--cargo);color:#fff;}
.suit-pill.active[data-suit="Location"]{background:var(--location);color:#000;}
.suit-pill.active[data-suit="Encounter"]{background:var(--encounter);color:#fff;}
.suit-pill.active[data-suit="Incident"]{background:var(--incident);color:#fff;}

.species-pill{font-family:'Exo 2',sans-serif;font-size:0.68rem;padding:0.18rem 0.55rem;border-radius:3px;border:1px solid var(--sp-bd);color:var(--sp-tx);background:var(--sp-bg);cursor:pointer;transition:all 0.15s;user-select:none;}
.species-pill:hover,.species-pill.active{background:rgba(220,140,60,0.25);border-color:#e09050;color:#f0b070;}
.regular-pill{font-family:'Exo 2',sans-serif;font-size:0.68rem;padding:0.18rem 0.55rem;border-radius:3px;border:1px solid var(--rg-bd);color:var(--rg-tx);background:var(--rg-bg);cursor:pointer;transition:all 0.15s;user-select:none;}
.regular-pill:hover,.regular-pill.active{background:rgba(74,159,212,0.22);border-color:var(--blue2);color:#fff;}
.other-pill{font-family:'Exo 2',sans-serif;font-size:0.68rem;padding:0.18rem 0.55rem;border-radius:3px;border:1px solid var(--ot-bd);color:var(--ot-tx);background:var(--ot-bg);cursor:pointer;transition:all 0.15s;user-select:none;}
.other-pill:hover,.other-pill.active{background:rgba(200,60,60,0.22);border-color:#e05a5a;color:#ff8080;}
.skill-pill{font-family:'Exo 2',sans-serif;font-size:0.68rem;padding:0.18rem 0.55rem;border-radius:3px;border:1px solid rgba(200,168,75,0.3);color:var(--gold);background:rgba(200,168,75,0.06);cursor:pointer;transition:all 0.15s;user-select:none;}
.skill-pill:hover,.skill-pill.active{background:rgba(200,168,75,0.2);border-color:var(--gold);color:#e8c96a;}

/* RESULTS BAR */
.results-bar{max-width:1100px;margin:0.5rem auto 0;padding:0 1.5rem 0.5rem;display:flex;align-items:center;justify-content:space-between;}
.result-count{font-family:'Orbitron',sans-serif;font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);}
.result-count span{color:var(--blue2);}

/* DECK GROUPS */
.deck-groups{max-width:1100px;margin:0 auto;padding:0 1.5rem 3rem;}
.deck-group{margin-bottom:1.5rem;}
.deck-group-header{font-family:'Orbitron',sans-serif;font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--blue);border-bottom:1px solid var(--border);padding-bottom:0.4rem;margin-bottom:0.6rem;display:flex;align-items:center;gap:0.5rem;}
.deck-count{color:var(--muted);font-size:0.55rem;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:0.6rem;}

/* PILL VIEW CARD */
.card-entry{background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:0.7rem;transition:border-color 0.15s,transform 0.15s;}
.card-entry:hover{border-color:var(--blue);transform:translateY(-2px);}
.card-entry[data-suit="Person"]{border-left:2px solid var(--person);}
.card-entry[data-suit="Ally"]{border-left:2px solid var(--ally);}
.card-entry[data-suit="Ship"]{border-left:2px solid var(--ship);}
.card-entry[data-suit="Cargo"]{border-left:2px solid var(--cargo);}
.card-entry[data-suit="Location"]{border-left:2px solid var(--location);}
.card-entry[data-suit="Encounter"]{border-left:2px solid var(--encounter);}
.card-entry[data-suit="Incident"]{border-left:2px solid var(--incident);}
.card-entry[data-suit=""]{border-left:2px solid var(--muted);}
.card-suit-bar{display:flex;align-items:center;gap:0.35rem;margin-bottom:0.35rem;}
.suit-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.suit-dot[data-suit="Person"]{background:var(--person);}
.suit-dot[data-suit="Ally"]{background:var(--ally);}
.suit-dot[data-suit="Ship"]{background:var(--ship);}
.suit-dot[data-suit="Cargo"]{background:var(--cargo);}
.suit-dot[data-suit="Location"]{background:var(--location);}
.suit-dot[data-suit="Encounter"]{background:var(--encounter);}
.suit-dot[data-suit="Incident"]{background:var(--incident);}
.suit-dot[data-suit=""]{background:var(--muted);}
.suit-label{font-family:'Orbitron',sans-serif;font-size:0.48rem;letter-spacing:0.15em;text-transform:uppercase;}
.suit-label[data-suit="Person"]{color:var(--person);}
.suit-label[data-suit="Ally"]{color:var(--ally);}
.suit-label[data-suit="Ship"]{color:var(--ship);}
.suit-label[data-suit="Cargo"]{color:var(--cargo);}
.suit-label[data-suit="Location"]{color:var(--location);}
.suit-label[data-suit="Encounter"]{color:var(--encounter);}
.suit-label[data-suit="Incident"]{color:var(--incident);}
.suit-label[data-suit=""]{color:var(--muted);}
.card-name{font-family:'Exo 2',sans-serif;font-size:0.85rem;font-weight:600;color:#fff;line-height:1.3;margin-bottom:0.45rem;}
.card-tags{display:flex;flex-wrap:wrap;gap:0.22rem;margin-bottom:0.3rem;}
.ctag{font-size:0.58rem;padding:0.07rem 0.3rem;border-radius:2px;}
.ctag-species{background:rgba(220,140,60,0.15);color:#d09060;border:1px solid rgba(220,140,60,0.3);}
.ctag-species.match{background:rgba(220,140,60,0.3);color:#f0b070;border-color:#e09050;}
.ctag-regular{background:rgba(74,159,212,0.10);color:#6ab8e0;border:1px solid rgba(74,159,212,0.25);}
.ctag-regular.match{background:rgba(74,159,212,0.25);color:#9ed8f5;border-color:var(--blue2);}
.ctag-other{background:rgba(200,60,60,0.10);color:#c06060;border:1px solid rgba(200,60,60,0.25);}
.ctag-other.match{background:rgba(200,60,60,0.25);color:#ff8080;border-color:#e05a5a;}
.card-skills{display:flex;flex-wrap:wrap;gap:0.22rem;}
.card-skill{font-size:0.58rem;padding:0.07rem 0.3rem;border-radius:2px;background:rgba(200,168,75,0.08);color:var(--gold);border:1px solid rgba(200,168,75,0.2);}
.card-skill.match{background:rgba(200,168,75,0.22);border-color:var(--gold);color:#e8c96a;}
.no-data{font-size:0.62rem;color:var(--muted);font-style:italic;}

/* IMAGE VIEW */
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.6rem;}
.card-img-entry{background:var(--bg2);border:1px solid var(--border);border-radius:5px;overflow:hidden;transition:border-color 0.15s,transform 0.15s;text-align:center;}
.card-img-entry:hover{border-color:var(--blue);transform:translateY(-2px);}
.card-img-entry img{width:100%;display:block;background:var(--bg3);}
.card-img-name{font-size:0.65rem;padding:0.3rem 0.4rem;color:var(--text);line-height:1.2;}
.img-placeholder{width:100%;aspect-ratio:5/7;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:0.6rem;font-family:'Orbitron',sans-serif;letter-spacing:0.1em;}

.collapsible-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:0.3rem 0;user-select:none;}
.collapsible-header:hover .filter-label{color:var(--blue2);}
.collapsible-arrow{font-size:0.6rem;color:var(--muted);transition:transform 0.2s;margin-left:0.5rem;flex-shrink:0;}
.collapsible-header.open .collapsible-arrow{transform:rotate(90deg);}
.active-summary{font-size:0.6rem;color:var(--sp-tx);margin-left:0.5rem;font-family:'Exo 2',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px;}
.active-summary.regular{color:var(--rg-tx);}
.active-summary.other{color:var(--ot-tx);}
.active-summary.skill{color:var(--gold);}
.collapsible-body{display:none;padding-top:0.4rem;}
.collapsible-body.open{display:block;}
.no-results{text-align:center;padding:3rem;color:var(--muted);font-family:'Orbitron',sans-serif;font-size:0.7rem;letter-spacing:0.15em;}

footer{border-top:1px solid var(--border);padding:1.25rem 1.5rem;text-align:center;font-size:0.72rem;color:var(--muted);line-height:1.8;}
</style>
</head>
<body>

<div class="nav-bar"><a href="index.html">← Back to Compendium</a></div>

<header class="chapter-header">
  <div class="chapter-label">ST:CC Strategy Compendium</div>
  <h1 class="chapter-title"><span>Card</span> Browser</h1>
  <div class="chapter-meta">Select boxes, filter by trait or skill, search by name</div>
</header>

<div class="controls">

  <div class="search-row">
    <input type="text" class="search-box" id="searchInput" placeholder="Search by card name…" autocomplete="off">
    <button class="clear-btn" onclick="clearAll()">Clear all</button>
  </div>

  <div class="filter-section">
    <div class="filter-label">Box</div>
    <div class="pill-row" id="boxFilters"></div>
  </div>

  <div class="filter-section view-section">
    <div class="filter-label">View</div>
    <div class="pill-row">
      <button class="vtoggle active" id="btnPill" onclick="setView('pill')">Cards</button>
      <button class="vtoggle" id="btnImg" onclick="setView('image')">Images</button>
    </div>
  </div>

  <div class="filter-section">
    <div class="filter-label">Deck</div>
    <div class="pill-row" id="deckFilters"></div>
  </div>

  <div class="filter-section">
    <div class="filter-label">Suit</div>
    <div class="pill-row" id="suitFilters"></div>
  </div>

  <div class="filter-section">
    <div class="collapsible-header" onclick="toggleSection(this,'speciesBody','speciesSummary')">
      <div style="display:flex;align-items:center;gap:0.4rem;">
        <div class="filter-label">Species Traits</div>
        <span class="active-summary" id="speciesSummary"></span>
      </div>
      <span class="collapsible-arrow">&#9654;</span>
    </div>
    <div class="collapsible-body" id="speciesBody">
      <div class="pill-row" id="speciesFilters"></div>
    </div>
  </div>

  <div class="filter-section">
    <div class="collapsible-header" onclick="toggleSection(this,'regularBody','regularSummary')">
      <div style="display:flex;align-items:center;gap:0.4rem;">
        <div class="filter-label">Regular Traits</div>
        <span class="active-summary regular" id="regularSummary"></span>
      </div>
      <span class="collapsible-arrow">&#9654;</span>
    </div>
    <div class="collapsible-body" id="regularBody">
      <div class="pill-row" id="regularFilters"></div>
    </div>
  </div>

  <div class="filter-section">
    <div class="collapsible-header" onclick="toggleSection(this,'otherBody','otherSummary')">
      <div style="display:flex;align-items:center;gap:0.4rem;">
        <div class="filter-label">Other Traits</div>
        <span class="active-summary other" id="otherSummary"></span>
      </div>
      <span class="collapsible-arrow">&#9654;</span>
    </div>
    <div class="collapsible-body" id="otherBody">
      <div class="pill-row" id="otherFilters"></div>
    </div>
  </div>

  <div class="filter-section">
    <div class="collapsible-header" onclick="toggleSection(this,'skillsBody','skillsSummary')">
      <div style="display:flex;align-items:center;gap:0.4rem;">
        <div class="filter-label">Skills</div>
        <span class="active-summary skill" id="skillsSummary"></span>
      </div>
      <span class="collapsible-arrow">&#9654;</span>
    </div>
    <div class="collapsible-body" id="skillsBody">
      <div class="pill-row" id="skillFilters"></div>
    </div>
  </div>

</div>

<div class="results-bar">
  <div class="result-count">Showing <span id="countDisplay">0</span> cards</div>
</div>

<div class="deck-groups" id="deckGroups"></div>

<footer>Card images &copy; WizKids.<br>Content by Matthew McCue (mdmccu2) &middot; Formatting by Periodic_agent</footer>

const BOXES = {core:"Captain's Chair",tbg:"To Boldly Go","2nd":"2nd Contact"};
const DECK_ORDER = ["Common","Sisko","Picard","Koloth","Burnham","Sela","Shran","Promo 1","Georgiou","Soval","Kirk","Archer","Rebner","Khan","Promo 2","Pike","Riker","Freeman"];

const DECK_BOX = {
  "Common":  "core",
  "Sisko":   "core","Picard":"core","Koloth":"core","Burnham":"core","Sela":"core","Shran":"core",
  "Promo 1": "core",
  "Georgiou":"tbg","Soval":"tbg","Kirk":"tbg","Archer":"tbg","Rebner":"tbg","Khan":"tbg",
  "Promo 2": "tbg",
  "Pike":    "2nd","Riker":"2nd","Freeman":"2nd"
};
const SUITS = ["Person","Ally","Ship","Cargo","Location","Encounter","Incident"];

let activeBoxes  = new Set(["core"]);
let activeDecks  = new Set(['Common']);
let activeSuits  = new Set();
let activeTags   = new Set();
let activeSkills = new Set();
let searchText   = "";
let viewMode     = "pill";

// Collect filter options from Common cards only (tagged)
const commonCards = ALL_CARDS.filter(c=>c.deck==="Common");
const allSpecies  = [...new Set(commonCards.flatMap(c=>c.species))].sort();
const allRegular  = [...new Set(commonCards.flatMap(c=>c.regular))].sort();
const allOther    = [...new Set(commonCards.flatMap(c=>c.other))].sort();
const allSkills   = [...new Set(commonCards.flatMap(c=>c.skills))].sort();

function setView(v){
  viewMode=v;
  document.getElementById('btnPill').classList.toggle('active',v==='pill');
  document.getElementById('btnImg').classList.toggle('active',v==='image');
  render();
}

function makePill(text,cls,store,extra){
  const p=document.createElement('span');
  p.className=cls; p.textContent=text;
  if(extra) Object.assign(p.dataset,extra);
  p.onclick=()=>{
    if(store.has(text)) store.delete(text); else store.add(text);
    p.classList.toggle('active'); render();
  };
  return p;
}

// Box filters
const boxContainer=document.getElementById('boxFilters');
Object.entries(BOXES).forEach(([id,label])=>{
  const p=document.createElement('span');
  p.className='box-pill'+(id==='core'?' active':''); p.textContent=label; p.dataset.box=id;
  p.onclick=()=>{
    if(activeBoxes.has(id)) activeBoxes.delete(id); else activeBoxes.add(id);
    p.classList.toggle('active'); render();
  };
  boxContainer.appendChild(p);
});

// Deck filters
const deckContainer=document.getElementById('deckFilters');
DECK_ORDER.forEach(d=>{
  const p=document.createElement('span');
  const box=DECK_BOX[d];
  const cls=d==='Common'?'common':box==='tbg'?'tbg':box==='2nd'?'second':'core';
  p.className='deck-pill '+cls; p.textContent=d;
  if(d==='Common') p.classList.add('active');
  p.onclick=()=>{
    if(activeDecks.has(d)) activeDecks.delete(d); else activeDecks.add(d);
    p.classList.toggle('active'); render();
  };
  deckContainer.appendChild(p);
});

// Suit filters
const suitContainer=document.getElementById('suitFilters');
SUITS.forEach(s=>{
  const p=document.createElement('span');
  p.className='suit-pill'; p.dataset.suit=s; p.textContent=s;
  p.onclick=()=>{
    if(activeSuits.has(s)) activeSuits.delete(s); else activeSuits.add(s);
    p.classList.toggle('active'); render();
  };
  suitContainer.appendChild(p);
});

document.getElementById('speciesFilters').append(...allSpecies.map(t=>makePill(t,'species-pill',activeTags)));
document.getElementById('regularFilters').append(...allRegular.map(t=>makePill(t,'regular-pill',activeTags)));
document.getElementById('otherFilters').append(...allOther.map(t=>makePill(t,'other-pill',activeTags)));
document.getElementById('skillFilters').append(...allSkills.map(t=>makePill(t,'skill-pill',activeSkills)));

document.getElementById('searchInput').addEventListener('input',e=>{searchText=e.target.value.toLowerCase().trim();render();});

function clearAll(){
  activeDecks.clear();activeSuits.clear();activeTags.clear();activeSkills.clear();searchText='';
  document.getElementById('searchInput').value='';
  document.querySelectorAll('.deck-pill,.suit-pill,.species-pill,.regular-pill,.other-pill,.skill-pill').forEach(p=>p.classList.remove('active'));
  updateSummaries();
  render();
}

function tagClass(t,card){
  if(card.species.includes(t)) return 'species';
  if(card.other.includes(t)) return 'other';
  return 'regular';
}

function cardMatches(c){
  if(!activeBoxes.has(c.box)) return false;
  if(!activeDecks.has(c.deck)) return false;
  if(activeSuits.size && !activeSuits.has(c.suit)) return false;
  if(searchText && !c.name.toLowerCase().includes(searchText)) return false;
  const allTags=[...c.species,...c.regular,...c.other];
  if(activeTags.size && ![...activeTags].every(t=>allTags.includes(t))) return false;
  if(activeSkills.size && ![...activeSkills].every(s=>c.skills.includes(s))) return false;
  return true;
}

function buildPillCard(c){
  const el=document.createElement('div');
  el.className='card-entry'; el.dataset.suit=c.suit||'';
  const allTags=[...c.species,...c.regular,...c.other];
  const tagsHTML=allTags.map(t=>{
    const cat=c.species.includes(t)?'species':c.other.includes(t)?'other':'regular';
    return `<span class="ctag ctag-${cat}${activeTags.has(t)?' match':''}">${t}</span>`;
  }).join('');
  const skillsHTML=c.skills.map(s=>`<span class="card-skill${activeSkills.has(s)?' match':''}">${s}</span>`).join('');
  const noData=!allTags.length&&!c.skills.length&&c.deck!=='Common';
  el.innerHTML=`
    <div class="card-suit-bar">
      <div class="suit-dot" data-suit="${c.suit||''}"></div>
      <div class="suit-label" data-suit="${c.suit||''}">${c.suit||'—'}</div>
    </div>
    <div class="card-name">${c.name}</div>
    ${tagsHTML?`<div class="card-tags">${tagsHTML}</div>`:''}
    ${skillsHTML?`<div class="card-skills">${skillsHTML}</div>`:''}
    ${noData?'<div class="no-data">traits pending</div>':''}
  `;
  return el;
}

function buildImgCard(c){
  const el=document.createElement('div');
  el.className='card-img-entry';
  el.innerHTML=`
    <div class="img-placeholder">NO IMAGE</div>
    <div class="card-img-name">${c.name}</div>
  `;
  return el;
}

function toggleSection(header, bodyId, summaryId){
  header.classList.toggle('open');
  document.getElementById(bodyId).classList.toggle('open');
}

function updateSummaries(){
  const sp=[...activeTags].filter(t=>allSpecies.includes(t));
  const rg=[...activeTags].filter(t=>allRegular.includes(t));
  const ot=[...activeTags].filter(t=>allOther.includes(t));
  const sk=[...activeSkills];
  document.getElementById('speciesSummary').textContent=sp.length?sp.join(', '):'';
  document.getElementById('regularSummary').textContent=rg.length?rg.join(', '):'';
  document.getElementById('otherSummary').textContent=ot.length?ot.join(', '):'';
  document.getElementById('skillsSummary').textContent=sk.length?sk.join(', '):'';
}

function render(){
  updateSummaries();
  const groups=document.getElementById('deckGroups');
  groups.innerHTML='';
  let total=0;
  DECK_ORDER.forEach(deck=>{
    const matched=ALL_CARDS.filter(c=>c.deck===deck&&cardMatches(c));
    if(!matched.length) return;
    total+=matched.length;
    const section=document.createElement('div');
    section.className='deck-group';
    const hdr=document.createElement('div');
    hdr.className='deck-group-header';
    hdr.innerHTML=`${deck} <span class="deck-count">(${matched.length} cards)</span>`;
    section.appendChild(hdr);
    const grid=document.createElement('div');
    grid.className=viewMode==='pill'?'card-grid':'img-grid';
    matched.forEach(c=>grid.appendChild(viewMode==='pill'?buildPillCard(c):buildImgCard(c)));
    section.appendChild(grid);
    groups.appendChild(section);
  });
  document.getElementById('countDisplay').textContent=total;
  if(!total){
    groups.innerHTML='<div class="no-results">No cards match the current filters.</div>';
  }
}

render();
</script>
</body>
</html>
