# Regenerates data/strategy-index.json whenever guide text or card data changes.
# Without this, the index silently goes stale the first time a guide is pushed
# without a manual rebuild.
name: Rebuild strategy index

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'box*.json'
      - 'tools/build_strategy_index.py'
      - 'tools/strategy_index_config.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build index
        run: python tools/build_strategy_index.py --report

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name  "stcc-index-bot"
            git config user.email "stcc-index-bot@users.noreply.github.com"
            git add data/strategy-index.json data/strategy-cards.json
            git commit -m "Rebuild strategy index [skip ci]"
            git push
          else
            echo "Index already current."
          fi
